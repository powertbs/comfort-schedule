name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  marketplace:
    # The Marketplace still validates with the hacs/action.
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built card is committed
        run: git diff --exit-code custom_components/comfort_schedule/frontend

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component pyyaml
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            # Surface the failure summary as annotations, readable without logging in.
            grep -E "^(FAILED|ERROR|E  )" pytest.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -5 pytest.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
